services:
  svg-mcp:
    build: ./mcp-server
    ports:
      - "8765:8765"   # editor UI + HTTP API
      - "8766:8766"   # MCP (SSE)
    environment:
      - HTTP_PORT=8765
      - MCP_PORT=8766
    volumes:
      - ./web:/app/web:ro       # editor UI (edit + reload, no rebuild)
      - ./data:/app/data        # documents (*.svg), exports/, .session.json
    restart: unless-stopped
