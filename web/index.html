<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG CNC Editor</title>
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='4' fill='%23262626'/%3E%3Cpath d='M6 17L17 6M6 6h5M13 17h5' stroke='%23e74c3c' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<!-- Title + menus -->
<header class="titlebar">
  <div class="app-name">SVG CNC</div>
  <nav class="menubar" id="menubar"></nav>
  <div class="doc-title" id="doc-title">Untitled</div>
  <div class="conn" id="conn" title="Server connection"><span class="dot"></span><span id="conn-label">Connecting…</span></div>
</header>

<!-- Action toolbar -->
<div class="toolbar" id="toolbar"></div>

<!-- Document tabs -->
<div class="tabbar" id="tabbar"></div>

<main>
  <!-- Tool palette -->
  <aside class="tools" id="tools"></aside>

  <!-- Canvas with rulers -->
  <section class="canvas-area">
    <div class="ruler-corner" id="ruler-corner" title="Toggle ruler units">cm</div>
    <div class="ruler ruler-h"><canvas id="ruler-h"></canvas></div>
    <div class="ruler ruler-v"><canvas id="ruler-v"></canvas></div>
    <div class="breadcrumb" id="breadcrumb" hidden></div>
    <div class="canvas-wrap" id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <g id="background"></g>
        <g id="content"></g>
        <g id="hits"></g>
        <g id="overlay"></g>
      </svg>
    </div>
  </section>

  <!-- 3D preview (replaces the canvas area while a 3D tab is active) -->
  <section class="view3d" id="view3d" hidden>
    <div class="view3d-canvas" id="view3d-canvas"></div>
    <div class="view3d-panel" id="view3d-panel"></div>
  </section>

  <!-- Right panels -->
  <aside class="side">
    <section class="panel" id="layers-panel">
      <header class="panel-head">
        <h2>Layers</h2>
        <button class="icon-btn" id="layer-add" title="New layer"></button>
      </header>
      <div id="layers"></div>
    </section>
    <section class="panel" id="entities-panel">
      <header class="panel-head">
        <h2>Entities</h2>
        <button class="icon-btn" id="entity-add" title="Group selection (⌘G)"></button>
      </header>
      <div id="entities"></div>
    </section>
    <section class="panel grow" id="inspector-panel">
      <header class="panel-head"><h2>Inspector</h2></header>
      <div id="inspector"></div>
    </section>
  </aside>
</main>

<!-- SVG code -->
<section class="code-panel" id="code-panel" hidden>
  <textarea id="code" spellcheck="false"></textarea>
  <div class="code-bar">
    <button class="btn primary" id="code-apply">Apply</button>
    <button class="btn" id="code-reload">Reload</button>
    <span class="muted" id="code-msg">Edit the SVG and press Apply (one undo step).</span>
  </div>
</section>

<footer class="statusbar">
  <span id="st-cursor">—</span>
  <span id="st-selection"></span>
  <span class="spacer"></span>
  <span id="st-layer"></span>
  <span id="st-doc"></span>
  <span id="st-zoom"></span>
</footer>

<div class="toasts" id="toasts"></div>
<dialog id="dialog"></dialog>
<input type="file" id="file-input" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
